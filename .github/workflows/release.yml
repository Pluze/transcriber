name: Release

on:
  push:
    tags: ['v*']

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Download inputs from successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh run list --workflow CI --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --name "release-inputs-$GITHUB_SHA" --dir release-inputs
      - name: Verify release shape
        run: |
          ZIP="release-inputs/Transcriber-macOS-arm64.zip"
          test "$(zipinfo -1 "$ZIP" | awk -F/ 'length { print $1 }' | sort -u)" = "Transcriber.app"
          ! zipinfo -1 "$ZIP" | grep -Eq '(^|/)\._|\.sh$'
          VERSION="${GITHUB_REF_NAME#v}"
          mv "$ZIP" "release-inputs/Transcriber-$VERSION-macOS-arm64.zip"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-inputs/Transcriber-*-macOS-arm64.zip \
            release-inputs/FFmpeg-9.0.1-source.tar.xz \
            --generate-notes --verify-tag
